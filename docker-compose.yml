name: starshield

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-starshield}
      MYSQL_DATABASE: starshield
    volumes:
      - mysql_data:/var/lib/mysql
      - ./starshield-backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3307:3306"   # 宿主机 3307，避免与本机 Homebrew MySQL(3306) 冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-starshield}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [starshield-net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [starshield-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [starshield-net]

  ai-service:
    build: ./ai-service
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [starshield-net]

  starshield-ingest:
    build: ./starshield-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,docker-ingest
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [starshield-net]

  starshield-worker:
    build: ./starshield-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,docker-worker
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-starshield}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      STARSHIELD_AI_PROVIDER: ${STARSHIELD_AI_PROVIDER:-deepseek}
      STARSHIELD_AI_LIGHTWEIGHT_URL: http://ai-service:5050/score
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [starshield-net]

  starshield-api:
    build: ./starshield-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker,docker-api
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-starshield}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      STARSHIELD_AI_PROVIDER: ${STARSHIELD_AI_PROVIDER:-deepseek}
      STARSHIELD_ADMIN_API_KEY: ${STARSHIELD_ADMIN_API_KEY:-starshield-dev-admin-key}
      BILIBILI_COOKIE: ${BILIBILI_COOKIE:-}
      STSHIELD_BASE: http://gateway:8080/api
    volumes:
      - ./bilichat-ingest:/app/bilichat-ingest:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [starshield-net]

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      starshield-ingest:
        condition: service_healthy
      starshield-api:
        condition: service_healthy
    networks: [starshield-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      starshield-ingest:
        condition: service_healthy
      starshield-api:
        condition: service_healthy
      starshield-worker:
        condition: service_healthy
    networks: [starshield-net]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-starshield}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [starshield-net]

networks:
  starshield-net:
    driver: bridge

volumes:
  mysql_data:
  grafana_data:
