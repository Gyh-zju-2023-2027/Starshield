upstream starshield_ingest {
    least_conn;
    server starshield-ingest:8080 max_fails=3 fail_timeout=10s;
}

upstream starshield_api {
    least_conn;
    server starshield-api:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;
    client_max_body_size 2m;

    # 高并发接入路径 → 专用 ingest 微服务
    location = /api/chat/upload {
        proxy_pass http://starshield_ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /ws/ {
        proxy_pass http://starshield_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://starshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/health {
        proxy_pass http://starshield_api;
    }
}
